<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070d" />
    <link rel="icon" href="../img/favicon.webp" type="image/webp" data-site-icon data-root="../" />
    <title>Admin Login | Saturn Aerospace</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background:
          linear-gradient(rgba(5, 7, 13, 0.72), rgba(5, 7, 13, 0.72)),
          url('../img/rhea_skirt.webp') center center / cover no-repeat;
      }

      body {
        display: grid;
        place-items: center;
        font-family: 'Inter', system-ui, sans-serif;
        color: #f7f8ff;
      }

      .page {
        display: grid;
        place-items: center;
        gap: 18px;
        width: min(100% - 32px, 38rem);
        text-align: center;
      }

      .title {
        margin: 0;
        font-size: clamp(1.6rem, 3vw, 2.6rem);
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-shadow: 0 1px 18px rgba(0, 0, 0, 0.55);
      }

      form {
        display: grid;
        gap: 12px;
        width: min(100%, 22rem);
      }

      label {
        display: grid;
        gap: 8px;
        color: rgba(247, 248, 255, 0.84);
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.7rem;
        font-weight: 700;
      }

      input {
        min-height: 46px;
        padding: 0 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        background: rgba(5, 7, 13, 0.32);
        color: #f7f8ff;
        font: inherit;
      }

      input:focus {
        outline: 2px solid rgba(194, 215, 255, 0.28);
        outline-offset: 1px;
      }

      button {
        min-height: 46px;
        border: 1px solid rgba(242, 222, 176, 0.32);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(242, 222, 176, 0.2), rgba(194, 215, 255, 0.06));
        color: #fff;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .status {
        min-height: 1.4em;
        margin: 0;
        color: rgba(167, 245, 186, 0.92);
        font-size: 0.92rem;
      }

      .copy {
        width: min(100%, 34rem);
        margin-top: 18px;
        display: grid;
        justify-items: center;
        text-align: center;
      }

      .copy p {
        margin: 0;
        line-height: 1.6;
      }

      .copy__eyebrow {
        color: rgba(247, 248, 255, 0.82);
        text-transform: uppercase;
        letter-spacing: 0.24em;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .copy__text {
        margin-top: 12px;
        max-width: 34rem;
        margin-inline: auto;
        color: rgba(247, 248, 255, 0.86);
        font-size: 1rem;
        text-shadow: 0 1px 16px rgba(0, 0, 0, 0.52);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 32px, 34rem);
        }
      }
    </style>
    <script>
      (() => {
        const icon = document.querySelector('link[data-site-icon]');
        if (!icon) return;
        const isHalloween = new Date().getMonth() === 9 && new Date().getDate() === 31;
        const file = isHalloween ? 'Halloween.webp' : 'favicon.webp';
        icon.href = new URL(icon.dataset.root + 'img/' + file, document.baseURI).href;
      })();
    </script>
    <script>
    (() => {
      if (document.getElementById('site-shell-loader')) return;
      const script = document.createElement('script');
      script.id = 'site-shell-loader';
      const marker = '/saturnaero.space-/';
      const path = decodeURIComponent(window.location.pathname.replace(/\\/g, '/'));
      const markerIndex = path.indexOf(marker);
      const relative = markerIndex >= 0 ? path.substring(markerIndex + marker.length) : path.replace(/^\/+/, '');
      const depth = Math.max(0, relative.split('/').filter(Boolean).length - 1);
      const root = depth > 0 ? '../'.repeat(depth) : './';
      script.src = root + 'shared/site-shell.js';
      document.head.appendChild(script);
    })();
  </script>
  </head>
  <body>
    <main class="page">
      <h1 class="title">Admin Login</h1>
      <form id="login-form" autocomplete="on">
        <label class="sr-only" aria-hidden="true">
          Username
          <input name="username" type="text" autocomplete="username" value="saturn-aerospace" tabindex="-1" />
        </label>
        <label>
          Admin code
          <input name="code" type="password" autocomplete="current-password" />
        </label>
        <button type="submit">Sign In</button>
        <p class="status" id="status" aria-live="polite"></p>
      </form>
    </main>

    <script>
      (() => {
        const form = document.getElementById('login-form');
        const status = document.getElementById('status');
        const expected = 'solisticforge';

        form?.addEventListener('submit', (event) => {
          event.preventDefault();
          const code = String(new FormData(form).get('code') || '').trim();

          if (code !== expected) {
            if (status) {
              status.textContent = 'Incorrect code.';
              status.style.color = 'rgba(255, 166, 166, 0.92)';
            }
            return;
          }

          window.sessionStorage.setItem('saturn-admin-unlocked', 'true');
          window.location.href = './panel/index.html';
        });
      })();
    </script>
  </body>
</html>
