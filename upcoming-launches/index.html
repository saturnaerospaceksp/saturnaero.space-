<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070d" />
    <title>Upcoming Launches | Saturn Aerospace</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

      :root {
        --site-bg: #05070d;
        --site-text: #f7f8ff;
        --site-text-soft: rgba(247, 248, 255, 0.76);
        --site-line: rgba(247, 248, 255, 0.12);
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--site-bg);
        color: var(--site-text);
        font-family: 'Inter', system-ui, sans-serif;
        overflow-x: hidden;
      }

      body {
        position: relative;
      }

      .launches-page {
        position: relative;
        z-index: 0;
        width: min(100% - 32px, 1160px);
        margin: 0 auto;
        padding: 108px 0 72px;
        display: grid;
        gap: 28px;
      }

      .launches-page::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -2;
        background: url('../img/payload_deploy.webp') center center / cover no-repeat;
      }

      .launches-page::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(180deg, rgba(5, 7, 13, 0.58) 0%, rgba(5, 7, 13, 0.78) 42%, rgba(5, 7, 13, 0.9) 100%),
          radial-gradient(circle at top right, rgba(91, 125, 212, 0.2), transparent 38%);
      }

      .launches-hero {
        display: grid;
        gap: 12px;
        max-width: 60rem;
      }

      .launches-hero__eyebrow {
        margin: 0;
        color: rgba(247, 248, 255, 0.72);
        text-transform: uppercase;
        letter-spacing: 0.26em;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .launches-hero__title {
        margin: 0;
        font-size: clamp(2.5rem, 4.8vw, 5.4rem);
        line-height: 0.92;
        letter-spacing: -0.06em;
        font-weight: 800;
        white-space: nowrap;
      }

      .launches-hero__text {
        margin: 0;
        max-width: 48rem;
        color: var(--site-text-soft);
        font-size: 1rem;
        line-height: 1.65;
      }

      .launches-hero__meta {
        margin: 4px 0 0;
        color: rgba(247, 248, 255, 0.88);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .launches-list {
        display: grid;
        gap: 0;
        border-top: 1px solid var(--site-line);
      }

      .launches-empty {
        padding: 28px 0;
        color: var(--site-text-soft);
        border-bottom: 1px solid var(--site-line);
      }

      .launch-item {
        padding: 22px 0 26px;
        border-bottom: 1px solid var(--site-line);
      }

      .launch-item__head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: start;
        margin-bottom: 16px;
      }

      .launch-item__name {
        margin: 0;
        font-size: clamp(1.4rem, 2.4vw, 2.2rem);
        line-height: 1.04;
        letter-spacing: -0.04em;
        font-weight: 800;
      }

      .launch-item__time {
        margin: 2px 0 0;
        color: rgba(247, 248, 255, 0.7);
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .launch-item__table {
        display: grid;
        gap: 14px;
      }

      .launch-item__row {
        display: grid;
        grid-template-columns: minmax(160px, 220px) minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }

      .launch-item__label {
        margin: 0;
        color: rgba(247, 248, 255, 0.72);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .launch-item__value {
        margin: 0;
        color: var(--site-text);
        line-height: 1.65;
      }

      .launch-item__value--muted {
        color: var(--site-text-soft);
      }

      @media (max-width: 860px) {
        .launches-page {
          width: min(100% - 24px, 1160px);
          padding-top: 118px;
        }

        .launches-hero__title {
          white-space: normal;
        }

        .launch-item__head {
          grid-template-columns: 1fr;
        }

        .launch-item__time {
          white-space: normal;
        }

        .launch-item__row {
          grid-template-columns: 1fr;
          gap: 6px;
        }
      }
    </style>
    <link rel="icon" href="../img/favicon.webp" type="image/webp" data-site-icon data-root="../" />
    <script>
      (() => {
        const icon = document.querySelector('link[data-site-icon]');
        if (!icon) return;
        const isHalloween = new Date().getMonth() === 9 && new Date().getDate() === 31;
        const file = isHalloween ? 'Halloween.webp' : 'favicon.webp';
        icon.href = new URL(icon.dataset.root + 'img/' + file, document.baseURI).href;
      })();
    </script>
    <script>
      (() => {
        if (document.getElementById('site-shell-loader')) return;
        const script = document.createElement('script');
        script.id = 'site-shell-loader';
        const marker = '/saturnaero.space-/';
        const path = decodeURIComponent(window.location.pathname.replace(/\\/g, '/'));
        const markerIndex = path.indexOf(marker);
        const relative = markerIndex >= 0 ? path.substring(markerIndex + marker.length) : path.replace(/^\/+/, '');
        const depth = markerIndex >= 0 ? Math.max(0, relative.split('/').filter(Boolean).length - 1) : (path.endsWith('/') ? relative.split('/').filter(Boolean).length : Math.max(0, relative.split('/').filter(Boolean).length - 1));
        const root = depth > 0 ? '../'.repeat(depth) : './';
        script.src = root + 'shared/site-shell.js';
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <main class="launches-page">
      <section class="launches-hero" aria-label="Upcoming launches introduction">
        <p class="launches-hero__eyebrow">Upcoming Launches</p>
        <h1 class="launches-hero__title">Mission Schedule</h1>
        <p class="launches-hero__text">
          Launch windows are listed below in your local timezone. Each mission is sourced from the
          same launch data the admin panel edits, so the header countdown and the schedule stay in
          step.
        </p>
        <p class="launches-hero__meta" id="next-launch-meta" aria-live="polite"></p>
      </section>

      <section class="launches-list" id="launches-list" aria-label="Launch schedule"></section>
    </main>

    <script>
      (() => {
        const boot = () => {
          const api = window.SaturnLaunches;
          const stateApi = window.SaturnSiteState;
          if (!api || !stateApi?.ready) {
            window.setTimeout(boot, 50);
            return;
          }

          const list = document.getElementById('launches-list');
          const meta = document.getElementById('next-launch-meta');

          const render = () => {
            const launches = api.getUpcomingLaunches();
            list.innerHTML = '';

            const nextLaunch = launches[0] || null;
            if (meta) {
              if (!nextLaunch) {
                meta.textContent = 'No upcoming launches are currently scheduled.';
              } else {
                const state = api.getWidgetState(nextLaunch);
                meta.textContent =
                  state.countdown || `${nextLaunch.missionName} · ${api.formatLaunchDateTime(nextLaunch.launchDateTime)}`;
              }
            }

            if (!launches.length) {
              const empty = document.createElement('div');
              empty.className = 'launches-empty';
              empty.textContent = 'No upcoming launches are currently scheduled.';
              list.append(empty);
              return;
            }

            launches.forEach((launch) => {
              const item = document.createElement('article');
              item.className = 'launch-item';

              const head = document.createElement('div');
              head.className = 'launch-item__head';

              const titleWrap = document.createElement('div');

              const title = document.createElement('h2');
              title.className = 'launch-item__name';
              title.textContent = launch.missionName;

              const time = document.createElement('p');
              time.className = 'launch-item__time';
              time.textContent = api.formatLaunchDateTime(launch.launchDateTime);

              titleWrap.append(title, time);

              const right = document.createElement('p');
              right.className = 'launch-item__time';
              right.textContent = launch.launchDateTime ? 'Scheduled' : 'TBC';

              head.append(titleWrap, right);

              const table = document.createElement('dl');
              table.className = 'launch-item__table';

              const rows = [
                ['Mission Description', launch.missionDescription],
                ['Orbit Type', launch.orbitType],
                ['Launch Date & Time', api.formatLaunchDateTime(launch.launchDateTime)],
                ['Launch Site', launch.launchSite],
                ['Vehicle', launch.vehicle],
              ];

              rows.forEach(([labelText, valueText]) => {
                const row = document.createElement('div');
                row.className = 'launch-item__row';

                const label = document.createElement('dt');
                label.className = 'launch-item__label';
                label.textContent = labelText + ':';

                const value = document.createElement('dd');
                value.className = 'launch-item__value';
                value.textContent = valueText || 'TBC';

                row.append(label, value);
                table.append(row);
              });

              item.append(head, table);
              list.append(item);
            });
          };

          stateApi.ready.then(() => {
            render();
          });

          window.addEventListener('storage', (event) => {
            if (
              event.key === api.storageKey ||
              event.key === 'saturn-home-stats' ||
              event.key === 'saturn-careers-roles'
            ) {
              render();
            }
          });
        };

        boot();
      })();
    </script>
  </body>
</html>
