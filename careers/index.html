<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050717" />
    <title>Careers At Saturn | Saturn Aerospace</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

      :root {
        --bg: #050717;
        --text: #f7f8ff;
        --muted: rgba(247, 248, 255, 0.74);
        --line: rgba(255, 255, 255, 0.12);
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
        overflow-x: hidden;
      }

      body {
        position: relative;
      }

      .page {
        width: min(100% - 32px, 1120px);
        margin: 0 auto;
        padding: 108px 0 80px;
        display: grid;
        gap: 24px;
      }

      .hero {
        display: grid;
        gap: 12px;
        max-width: 56rem;
      }

      .hero__eyebrow {
        margin: 0;
        color: rgba(247, 248, 255, 0.72);
        text-transform: uppercase;
        letter-spacing: 0.26em;
        font-size: 0.75rem;
        font-weight: 800;
      }

      .hero__title {
        margin: 0;
        font-size: clamp(2.5rem, 5.3vw, 5.6rem);
        line-height: 0.94;
        letter-spacing: -0.07em;
        font-weight: 900;
      }

      .hero__text {
        margin: 0;
        max-width: 44rem;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      .notice {
        margin-top: 12px;
        padding: 18px 20px 20px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.02);
      }

      .notice__title {
        margin: 0 0 8px;
        color: rgba(247, 248, 255, 0.78);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 0.78rem;
        font-weight: 800;
      }

      .notice__text {
        margin: 0;
        max-width: 54rem;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.65;
      }

      .roles {
        display: grid;
        gap: 16px;
      }

      .roles__head {
        display: grid;
        gap: 8px;
      }

      .roles__eyebrow {
        margin: 0;
        color: rgba(247, 248, 255, 0.68);
        text-transform: uppercase;
        letter-spacing: 0.22em;
        font-size: 0.74rem;
        font-weight: 800;
      }

      .roles__title {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2.4rem);
        line-height: 1.02;
        letter-spacing: -0.05em;
        font-weight: 900;
      }

      .roles__empty {
        margin: 0;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.65;
      }

      .roles__grid {
        display: grid;
        gap: 14px;
      }

      .role-card {
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .role-card__summary {
        list-style: none;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: start;
        padding: 18px 0 18px;
        cursor: pointer;
      }

      .role-card__summary::-webkit-details-marker {
        display: none;
      }

      .role-card[open] .role-card__summary {
        padding-bottom: 14px;
      }

      .role-card__head {
        display: grid;
        gap: 6px;
      }

      .role-card__title {
        margin: 0;
        font-size: clamp(1.2rem, 2.1vw, 1.9rem);
        line-height: 1.04;
        letter-spacing: -0.04em;
        font-weight: 900;
      }

      .role-card__meta {
        margin: 0;
        color: rgba(247, 248, 255, 0.68);
        font-size: 0.82rem;
        line-height: 1.5;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .role-card__status {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        color: rgba(247, 248, 255, 0.88);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .role-card__summary-right {
        display: flex;
        align-items: center;
        gap: 14px;
        justify-self: end;
      }

      .role-card__chevron {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        color: rgba(247, 248, 255, 0.78);
        font-size: 0.95rem;
        line-height: 1;
        transition: transform 180ms ease;
      }

      .role-card[open] .role-card__chevron {
        transform: rotate(180deg);
      }

      .role-card__body {
        display: grid;
        gap: 10px;
        padding: 0 0 20px;
      }

      .role-card__summary,
      .role-card__description,
      .role-card__experience {
        margin: 0;
        max-width: 58rem;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.65;
      }

      .role-card__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 6px;
      }

      .role-card__discord {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          background 180ms ease;
      }

      .role-card__discord:hover,
      .role-card__discord:focus-visible {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.24);
        background: rgba(255, 255, 255, 0.08);
      }

      @media (max-width: 700px) {
        .page {
          width: min(100% - 24px, 1120px);
          padding-top: 118px;
        }

        .hero__title {
          font-size: clamp(2.1rem, 10vw, 3.6rem);
        }

        .role-card__summary {
          grid-template-columns: 1fr;
        }

        .role-card__summary-right {
          justify-self: start;
        }

        .role-card__status {
          justify-self: start;
        }
      }
    </style>
    <link rel="icon" href="../img/favicon.webp" type="image/webp" data-site-icon data-root="../" />
    <script>
      (() => {
        const icon = document.querySelector('link[data-site-icon]');
        if (!icon) return;
        const isHalloween = new Date().getMonth() === 9 && new Date().getDate() === 31;
        const file = isHalloween ? 'Halloween.webp' : 'favicon.webp';
        icon.href = new URL(icon.dataset.root + 'img/' + file, document.baseURI).href;
      })();
    </script>
    <script>
      (() => {
        if (document.getElementById('site-shell-loader')) return;
        const script = document.createElement('script');
        script.id = 'site-shell-loader';
        const marker = '/saturnaero.space-/';
        const path = decodeURIComponent(window.location.pathname.replace(/\\/g, '/'));
        const markerIndex = path.indexOf(marker);
        const relative = markerIndex >= 0 ? path.substring(markerIndex + marker.length) : path.replace(/^\/+/, '');
        const depth = Math.max(0, relative.split('/').filter(Boolean).length - 1);
        const root = depth > 0 ? '../'.repeat(depth) : './';
        script.src = root + 'shared/site-shell.js';
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <main class="page">
      <section class="hero" aria-label="Careers introduction">
        <p class="hero__eyebrow">Careers</p>
        <h1 class="hero__title">Careers At Saturn</h1>
        <p class="hero__text">
          Saturn Aerospace is a virtual company and we bring on volunteers across the year, check
          here regularly for updates on openings!
        </p>
      </section>

      <section class="notice" aria-label="Careers status">
        <p class="notice__title">Status</p>
        <p class="notice__text">
          No career openings are posted right now.
        </p>
      </section>

      <section class="roles" aria-label="Career roles">
        <div class="roles__head">
          <p class="roles__eyebrow">Volunteer Opportunities</p>
          <h2 class="roles__title">Current roles</h2>
        </div>
        <p class="roles__empty" id="roles-empty">No career openings are posted right now.</p>
        <div class="roles__grid" id="roles-grid"></div>
      </section>
    </main>
    <script>
      (() => {
        const boot = () => {
          const stateApi = window.SaturnSiteState;
          if (!stateApi?.ready) {
            window.setTimeout(boot, 50);
            return;
          }

          const grid = document.getElementById('roles-grid');
          const empty = document.getElementById('roles-empty');

          const render = () => {
            const roles = stateApi.getRoles();
            grid.innerHTML = '';
            empty.hidden = roles.length > 0;

            if (!roles.length) {
              return;
            }

            roles.forEach((role) => {
              const card = document.createElement('details');
              card.className = 'role-card';

              const summary = document.createElement('summary');
              summary.className = 'role-card__summary';

              const head = document.createElement('div');
              head.className = 'role-card__head';

              const title = document.createElement('h3');
              title.className = 'role-card__title';
              title.textContent = role.title;

              const meta = document.createElement('p');
              meta.className = 'role-card__meta';
              meta.textContent = `${role.location} | ${role.type}`;

              head.append(title, meta);

              const right = document.createElement('div');
              right.className = 'role-card__summary-right';

              const status = document.createElement('span');
              status.className = 'role-card__status';
              status.textContent = role.status === 'closed' ? 'Closed' : 'Open';

              const chevron = document.createElement('span');
              chevron.className = 'role-card__chevron';
              chevron.innerHTML = '&#9662;';

              right.append(status, chevron);
              summary.append(head, right);

              const body = document.createElement('div');
              body.className = 'role-card__body';

              const summaryText = document.createElement('p');
              summaryText.className = 'role-card__summary';
              summaryText.textContent = role.summary || '';

              const description = document.createElement('p');
              description.className = 'role-card__description';
              description.textContent = role.roleDescription || '';

              body.append(summaryText, description);

              if (role.experienceRequired) {
                const experience = document.createElement('p');
                experience.className = 'role-card__experience';
                experience.textContent = `Experience: ${role.experienceRequired}`;
                body.append(experience);
              }

              const actions = document.createElement('div');
              actions.className = 'role-card__actions';

              const discord = document.createElement('a');
              discord.className = 'role-card__discord';
              discord.href = 'https://discord.gg/vxUdJjdtgq';
              discord.target = '_blank';
              discord.rel = 'noreferrer';
              discord.textContent = 'Join Discord';

              actions.append(discord);
              body.append(actions);

              card.append(summary, body);
              grid.append(card);
            });
          };

          stateApi.ready.then(render);
          window.addEventListener('storage', (event) => {
            if (event.key === 'saturn-careers-roles') {
              render();
            }
          });
        };

        boot();
      })();
    </script>
  </body>
</html>
