<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050717" />
    <title>Our Goal | Saturn Aerospace</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

      :root {
        --site-bg: #050717;
        --site-text: #f7f8ff;
        --site-text-soft: rgba(247, 248, 255, 0.76);
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: var(--site-bg);
        color: var(--site-text);
        font-family: 'Inter', system-ui, sans-serif;
        overflow-x: hidden;
      }

      body {
        position: relative;
        padding-top: 0 !important;
      }

      .page {
        position: relative;
        width: 100%;
        margin: 0 auto;
        min-height: 100vh;
        padding: 0;
      }

      .goal-hero {
        position: relative;
        isolation: isolate;
        width: 100%;
        min-height: 100svh;
        display: block;
        text-align: center;
        overflow: hidden;
      }

      .goal-hero__media {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: 0;
        pointer-events: none;
        filter: saturate(0.95) contrast(1.02);
      }

      .goal-hero::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(5, 7, 23, 0.24) 0%, rgba(5, 7, 23, 0.18) 30%, rgba(5, 7, 23, 0.56) 100%),
          linear-gradient(90deg, rgba(5, 7, 23, 0.18) 0%, rgba(5, 7, 23, 0.06) 50%, rgba(5, 7, 23, 0.18) 100%);
      }

      .goal-hero__content {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(100% - 32px, 980px);
        transform: translate(-50%, -50%);
        display: grid;
        justify-items: center;
        gap: 12px;
        padding: 0;
        z-index: 2;
      }

      .hero__eyebrow {
        margin: 0;
        color: rgba(247, 248, 255, 0.72);
        text-transform: uppercase;
        letter-spacing: 0.26em;
        font-size: 0.75rem;
        font-weight: 700;
      }

      .hero__title {
        margin: 0;
        font-size: clamp(2.4rem, 4.4vw, 4.9rem);
        line-height: 0.94;
        letter-spacing: -0.06em;
        font-weight: 800;
        max-width: 16ch;
      }

      .hero__text {
        margin: 0;
        max-width: 52rem;
        color: var(--site-text-soft);
        font-size: 1rem;
        line-height: 1.7;
      }

      @media (max-width: 700px) {
        .page {
          padding: 0;
        }

        .hero__title {
          white-space: normal;
          max-width: none;
          font-size: clamp(2rem, 10vw, 3.4rem);
          letter-spacing: -0.05em;
        }

        .goal-hero {
          min-height: 100svh;
          padding: 0;
        }

        .goal-hero__content {
          top: 58%;
          width: min(100% - 24px, 680px);
          gap: 10px;
        }

        .hero__text {
          max-width: 34rem;
          font-size: 0.94rem;
          line-height: 1.55;
        }
      }
    </style>
    <link rel="icon" href="../img/favicon.webp" type="image/webp" data-site-icon data-root="../" />
    <script>
      (() => {
        const icon = document.querySelector('link[data-site-icon]');
        if (!icon) return;
        const isHalloween = new Date().getMonth() === 9 && new Date().getDate() === 31;
        const file = isHalloween ? 'Halloween.webp' : 'favicon.webp';
        icon.href = new URL(icon.dataset.root + 'img/' + file, document.baseURI).href;
      })();
    </script>
    <script>
    (() => {
      if (document.getElementById('site-shell-loader')) return;
      const script = document.createElement('script');
      script.id = 'site-shell-loader';
      const marker = '/saturnaero.space-/';
      const path = decodeURIComponent(window.location.pathname.replace(/\\/g, '/'));
      const markerIndex = path.indexOf(marker);
      const relative = markerIndex >= 0 ? path.substring(markerIndex + marker.length) : path.replace(/^\/+/, '');
      const depth = Math.max(0, relative.split('/').filter(Boolean).length - 1);
      const root = depth > 0 ? '../'.repeat(depth) : './';
      script.src = root + 'shared/site-shell.js';
      document.head.appendChild(script);
    })();
  </script>
  </head>
  <body>
    <main class="page">
      <section class="goal-hero" aria-label="Our goal introduction">
        <img class="goal-hero__media" src="../img/img_careers_splash.webp" alt="" aria-hidden="true" />
        <div class="goal-hero__content">
          <p class="hero__eyebrow">The Future</p>
          <h1 class="hero__title">A Multi-Planet Future</h1>
          <p class="hero__text">
            Our goal is to make humans a multi planet species, pushing the boundaries of what's
            possible. We want to build the launch systems, operational discipline, and flight
            hardware that make long-term presence beyond Earth practical, repeatable, and real.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
